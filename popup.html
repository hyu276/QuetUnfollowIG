<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QuetUnfollowIG</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="popup">
    <div class="brand">QuetUnfollowIG</div>
    <p id="status" class="status">Đang kiểm tra phiên Instagram…</p>

    <div class="pairing-card">
      <span class="label">Live website pairing key</span>
      <div class="pairing-row">
        <code id="pairingKey">Đang tạo…</code>
        <button id="copyKey" class="icon-button" title="Copy pairing key">Copy</button>
      </div>
      <button id="rotateKey" class="text-button">Tạo pairing key mới</button>
    </div>

    <button id="crawl" class="primary">Crawl ngay</button>
    <button id="dashboard" class="secondary">Mở Dashboard</button>
    <p class="hint">Không chia sẻ pairing key. Dữ liệu chỉ lưu trong trình duyệt này.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
